version: "3"

# Environment is loaded via mise (see mise.toml).
# Fallback: dotenv for environments without mise.
dotenv: [".env"]

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list-all

  generate:
    desc: Generate protobuf and connect-go code
    cmds:
      - buf generate

  generate:sqlc:
    desc: Generate sqlc code for Postgres token store
    dir: tokenstore/postgres
    cmds:
      - sqlc generate

  generate:apikey:
    desc: Generate a cryptographically random API key
    cmds:
      - openssl rand -hex 32

  lint:
    desc: Lint protobuf definitions
    cmds:
      - buf lint

  build:
    desc: Build the objs server binary
    cmds:
      - go build -o bin/objs ./cmd/objs

  test:
    desc: Run all tests
    cmds:
      - go test -v -count=1 ./...

  test:cover:
    desc: Run tests with coverage summary
    cmds:
      - go test -coverprofile=coverage.out -count=1 ./...

  test:cover:html:
    desc: Generate HTML coverage report and open in browser
    cmds:
      - go test -coverprofile=coverage.out -count=1 ./...
      - go tool cover -html=coverage.out -o coverage.html
      - open coverage.html

  test:e2e:
    desc: Run only e2e tests
    cmds:
      - go test -v -count=1 -run 'TestE2E_' ./...

  test:postgres:
    desc: Run Postgres integration tests (reads OBJECT_STORE_POSTGRES_URL from .env)
    dir: tokenstore/postgres
    cmds:
      - go test -v -count=1 ./...

  run:
    desc: Run the server locally
    cmds:
      - go run ./cmd/objs

  live:
    desc: Run the server with live reload (requires air)
    cmds:
      - air -c .air.toml -- || go run ./cmd/objs

  clean:
    desc: Remove build artifacts and local data
    cmds:
      - rm -rf bin/
      - rm -rf .data/

  tidy:
    desc: Tidy go modules
    cmds:
      - go mod tidy
      - cd tokenstore/postgres && go mod tidy

syntax = "proto3";
package objectstore.v1;
option go_package = "github.com/laenen-partners/objectstore/gen/objectstore/v1;objectstorev1";

import "google/protobuf/timestamp.proto";

service ObjectStoreService {
  rpc PresignPut(PresignPutRequest) returns (PresignPutResponse);
  rpc PresignGet(PresignGetRequest) returns (PresignGetResponse);
  rpc HeadObject(HeadObjectRequest) returns (HeadObjectResponse);
  rpc DeleteObject(DeleteObjectRequest) returns (DeleteObjectResponse);
  rpc ListByPrefix(ListByPrefixRequest) returns (ListByPrefixResponse);
  rpc EnsureBucket(EnsureBucketRequest) returns (EnsureBucketResponse);
}

message PresignPutRequest {
  string bucket = 1;
  string key = 2;
  string content_type = 3;
  int32 expires_seconds = 4; // default 900
  int64 max_size = 5;
  repeated string allowed_types = 6;
  string signature = 7;
  string scope = 8;
}

message PresignPutResponse {
  string url = 1;
}

message PresignGetRequest {
  string bucket = 1;
  string key = 2;
  int32 expires_seconds = 3; // default 900
  string filename = 4; // Content-Disposition attachment filename
}

message PresignGetResponse {
  string url = 1;
}

message HeadObjectRequest {
  string bucket = 1;
  string key = 2;
}

message HeadObjectResponse {
  string key = 1;
  int64 size = 2;
  string content_type = 3;
  google.protobuf.Timestamp last_modified = 4;
  string etag = 5;
}

message DeleteObjectRequest {
  string bucket = 1;
  string key = 2;
}

message DeleteObjectResponse {}

message ListByPrefixRequest {
  string bucket = 1;
  string prefix = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message ListByPrefixResponse {
  repeated string keys = 1;
  string next_page_token = 2;
}

message EnsureBucketRequest {
  string bucket = 1;
}

message EnsureBucketResponse {}

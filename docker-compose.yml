services:
  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: objectstore
      POSTGRES_PASSWORD: objectstore
      POSTGRES_DB: objectstore
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U objectstore" ]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
